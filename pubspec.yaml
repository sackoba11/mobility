name: mobility
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: ^3.12.2

dependencies: 
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  flutter: 
    sdk: flutter

  firebase_core: ^4.12.1
  google_fonts: ^8.2.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  google_maps_flutter: ^2.4.0
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_screenutil: ^5.9.0
  injectable: ^3.0.0
  dartz: ^0.10.1
  flutter_polyline_points:
  google_places_flutter:
  dio: ^5.11.0
  http: ^1.1.0
  dropdown_button2: ^3.1.0
  firebase_database: ^12.4.6
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1
  flutter_steps: ^2.0.1
  infinite_scroll_pagination: ^5.1.0
  flutter_native_splash: ^2.4.8
  flutter_gen: ^5.10.0
  get_storage: ^2.1.1
  
  

dev_dependencies: 
  build_runner: ^2.4.7
  flutter_gen_runner: ^5.3.2
  flutter_lints: ^6.0.0
  flutter_test: 
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.7.1
  injectable_generator: ^3.0.2



flutter_gen:
  output: lib/common/assets/

  # Optional
  integrations:
    flutter_svg: true
    rive: false
    lottie: false
    
flutter: 
  uses-material-design: true
  assets:
    - assets/


scripts:
  gen-build: "dart run build_runner build"
  gen-watch: "dart run build_runner watch"
  build: ".fvm/flutter_sdk/bin/flutter build apk --split-per-abi"
  gen-assets: "fluttergen -c pubspec.yaml && dart run build_runner build"
  native-splash:
    - dart pub run flutter_native_splash:remove --path=splash.yaml
    - dart pub run flutter_native_splash:create --path=splash.yaml
